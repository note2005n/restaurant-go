databases:
  - name: restaurant-db
    plan: free

services:
  - type: web
    name: restaurant
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: COOKIE_SECURE
        value: "1"
