{{if .Data}}
<div class="menu-grid">
  {{range .Data}}
  <div class="menu-card">
    {{if .ImageURL}}
      <img src="{{.ImageURL}}" alt="{{.Name}}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px 8px 0 0;">
    {{end}}
    <div style="padding: 15px;">
      <span class="category">{{.Category}}</span>
      <h3>{{.Name}}</h3>
      <p>{{.Description}}</p>
      <div class="price" style="font-weight: bold; color: #e65100; margin-bottom: 10px;">{{.Price}} บาท</div>
      
      <form action="/orders" method="POST" style="display: flex; gap: 5px; align-items: center;">
        <input type="hidden" name="csrf" value="{{$.CSRF}}">
        <input type="hidden" name="menu_id" value="{{.ID}}">
        <input type="number" name="quantity" value="1" min="1" max="20" style="width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
        <button type="submit" style="background-color: #e65100; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; flex: 1;">
          🛒 สั่งอาหาร
        </button>
      </form>
    </div>
  </div>
  {{end}}
</div>
{{end}}
